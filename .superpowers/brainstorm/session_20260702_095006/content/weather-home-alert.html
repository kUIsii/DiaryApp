<div class="section">
  <h3>交互逻辑</h3>
  <ul>
    <li>无预警时：天气行不变，只显示天气概况</li>
    <li>有预警时：天气行右侧出现红色预警标签</li>
    <li>点击标签：原地展开显示预警原文</li>
    <li>再次点击：收起</li>
    <li>点击天气行左侧区域：跳转天气详情页（不变）</li>
  </ul>
</div>
