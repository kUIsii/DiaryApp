<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --text: #1A1A2E;
            --placeholder: rgba(0,0,0,0.3);
        }
        .theme-dark {
            --text: #E0E0E0;
            --placeholder: rgba(255,255,255,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text);
        }
        .ql-toolbar.ql-snow { display: none !important; }
        .ql-container.ql-snow {
            border: none !important;
            font-size: 16px;
            line-height: 1.8;
        }
        .ql-editor {
            min-height: 100%;
            padding: 0 16px;
            color: var(--text);
        }
        .ql-editor.ql-blank::before {
            color: var(--placeholder);
            font-style: normal;
        }
        hr { border: none; border-top: 1px solid rgba(128,128,128,0.3); margin: 16px 0; }
        blockquote {
            border-left: 3px solid #667EEA;
            padding-left: 12px;
            color: rgba(128,128,128,0.8);
            margin: 8px 0;
        }
        img, video { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="editor"></div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
        var BlockEmbed = Quill.import('blots/block/embed');
        class DividerBlot extends BlockEmbed {}
        DividerBlot.blotName = 'divider';
        DividerBlot.tagName = 'hr';
        Quill.register(DividerBlot);

        var quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: '开始写日记...',
            modules: { toolbar: false }
        });

        function setTheme(mode) {
            if (mode === 'dark') {
                document.body.className = 'theme-dark';
                document.body.style.background = '#1A1A2E';
            } else {
                document.body.className = '';
                document.body.style.background = 'transparent';
            }
        }

        // Format commands (called from Compose toolbar)
        function toggleBold() { var f = quill.getFormat(); quill.format('bold', !f.bold); }
        function toggleItalic() { var f = quill.getFormat(); quill.format('italic', !f.italic); }
        function toggleUnderline() { var f = quill.getFormat(); quill.format('underline', !f.underline); }
        function toggleStrike() { var f = quill.getFormat(); quill.format('strike', !f.strike); }
        function toggleBlockquote() { var f = quill.getFormat(); quill.format('blockquote', !f.blockquote); }
        function setHeading(level) { quill.format('header', level); }
        function setOrderedList() { var f = quill.getFormat(); quill.format('list', f.list === 'ordered' ? false : 'ordered'); }
        function setBulletList() { var f = quill.getFormat(); quill.format('list', f.list === 'bullet' ? false : 'bullet'); }
        function insertDivider() {
            var r = quill.getSelection(true);
            quill.insertText(r.index, '\n');
            quill.insertEmbed(r.index + 1, 'divider', true);
            quill.setSelection(r.index + 2);
        }
        function setTextColor(color) { quill.format('color', color); }
        function setBackgroundColor(color) { quill.format('background', color); }
        function clearFormatting() {
            var r = quill.getSelection();
            if (r) quill.removeFormat(r.index, r.length);
        }
        function insertMedia(type, url) {
            var r = quill.getSelection(true);
            quill.insertEmbed(r.index, type, url);
            quill.setSelection(r.index + 1);
        }
        function insertLink() {
            var url = prompt('输入链接地址:', 'https://');
            if (url) {
                var r = quill.getSelection(true);
                quill.insertText(r.index, url, 'link', url);
            }
        }

        // Bridge functions
        function getContent() { return JSON.stringify(quill.getContents()); }
        function getPlainText() { return quill.getText(); }
        function setContent(deltaJSON) {
            try { quill.setContents(JSON.parse(deltaJSON)); }
            catch(e) { quill.setText(deltaJSON); }
        }
        function setTemplate(text) { quill.setText(text); }
        function setFontSize(size) { document.querySelector('.ql-editor').style.fontSize = size + 'px'; }
        function focusEditor() { quill.focus(); }

        // Content change callback for word count and auto-save
        quill.on('text-change', function() {
            if (window.DiaryBridge) {
                DiaryBridge.onContentChange(quill.getText());
            }
        });
    </script>
</body>
</html>
