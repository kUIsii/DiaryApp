<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background: #f0f0f0; }
#map { width: 100%; height: 100%; position: relative; background: #e8e8e8; overflow: hidden; }
.tile { position: absolute; border: none; }
.marker {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50% 50% 50% 0;
    background: #5C6BC0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 10;
}
.marker::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    top: 7px;
    left: 7px;
}
.marker-count {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #E91E63;
    color: white;
    font-size: 10px;
    font-weight: bold;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    transform: rotate(45deg);
    z-index: 11;
}
.popup {
    position: absolute;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    padding: 12px 16px;
    z-index: 100;
    min-width: 180px;
    max-width: 260px;
    display: none;
}
.popup-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; }
.popup-location { font-size: 12px; color: #666; margin-bottom: 2px; }
.popup-date { font-size: 11px; color: #999; }
.popup-item { padding: 6px 0; border-bottom: 1px solid #eee; }
.popup-item:last-child { border-bottom: none; }
.zoom-controls {
    position: absolute;
    bottom: 20px;
    right: 16px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.zoom-btn {
    width: 36px;
    height: 36px;
    background: white;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}
.zoom-btn:active { background: #f0f0f0; }
</style>
</head>
<body>
<div id="map"></div>
<div class="popup" id="popup"></div>
<div class="zoom-controls">
    <button class="zoom-btn" id="zoomInBtn">+</button>
    <button class="zoom-btn" id="zoomOutBtn">-</button>
</div>
<script>
(function() {
    var mapEl = document.getElementById('map');
    var popupEl = document.getElementById('popup');
    var zoomInBtn = document.getElementById('zoomInBtn');
    var zoomOutBtn = document.getElementById('zoomOutBtn');

    var centerLat = 35.86;
    var centerLng = 104.19;
    var zoom = 4;
    var allMarkers = [];
    var isDragging = false;
    var dragStartX, dragStartY;
    var dragStartLat, dragStartLng;

    function getTileUrl(x, y, z) {
        var s = ((x + y) % 4) + 1;
        return 'https://webrd0' + s + '.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=' + x + '&y=' + y + '&z=' + z;
    }

    function latLngToPixel(lat, lng, z) {
        var scale = 256 * Math.pow(2, z);
        var x = (lng + 180) / 360 * scale;
        var sinLat = Math.sin(lat * Math.PI / 180);
        var y = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale;
        return { x: x, y: y };
    }

    function renderTiles() {
        var w = mapEl.offsetWidth;
        var h = mapEl.offsetHeight;
        if (w === 0 || h === 0) return;

        var oldTiles = mapEl.querySelectorAll('.tile');
        for (var i = 0; i < oldTiles.length; i++) {
            oldTiles[i].parentNode.removeChild(oldTiles[i]);
        }

        var center = latLngToPixel(centerLat, centerLng, zoom);
        var startX = center.x - w / 2;
        var startY = center.y - h / 2;
        var tileStartX = Math.floor(startX / 256);
        var tileStartY = Math.floor(startY / 256);
        var tileEndX = Math.ceil((startX + w) / 256);
        var tileEndY = Math.ceil((startY + h) / 256);
        var maxTile = Math.pow(2, zoom);

        for (var tx = tileStartX; tx <= tileEndX; tx++) {
            for (var ty = tileStartY; ty <= tileEndY; ty++) {
                if (tx < 0 || ty < 0 || tx >= maxTile || ty >= maxTile) continue;
                var img = document.createElement('img');
                img.className = 'tile';
                img.src = getTileUrl(tx, ty, zoom);
                img.style.left = (tx * 256 - startX) + 'px';
                img.style.top = (ty * 256 - startY) + 'px';
                img.style.width = '256px';
                img.style.height = '256px';
                img.draggable = false;
                mapEl.appendChild(img);
            }
        }
    }

    function renderMarkers() {
        var oldMarkers = mapEl.querySelectorAll('.marker');
        for (var i = 0; i < oldMarkers.length; i++) {
            oldMarkers[i].parentNode.removeChild(oldMarkers[i]);
        }

        var w = mapEl.offsetWidth;
        var h = mapEl.offsetHeight;
        if (w === 0 || h === 0) return;

        var center = latLngToPixel(centerLat, centerLng, zoom);

        for (var i = 0; i < allMarkers.length; i++) {
            var m = allMarkers[i];
            var pos = latLngToPixel(m.lat, m.lng, zoom);
            var screenX = pos.x - center.x + w / 2;
            var screenY = pos.y - center.y + h / 2;

            if (screenX < -50 || screenX > w + 50 || screenY < -50 || screenY > h + 50) continue;

            var el = document.createElement('div');
            el.className = 'marker';
            el.style.left = (screenX - 14) + 'px';
            el.style.top = (screenY - 28) + 'px';

            if (m.count > 1) {
                var badge = document.createElement('span');
                badge.className = 'marker-count';
                badge.textContent = m.count;
                el.appendChild(badge);
            }

            (function(marker, sx, sy) {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    showPopup(marker, sx, sy);
                    if (window.MapBridge) {
                        window.MapBridge.onMarkerClick(marker.id);
                    }
                });
            })(m, screenX, screenY);

            mapEl.appendChild(el);
        }
    }

    function showPopup(marker, x, y) {
        var html = '';
        for (var i = 0; i < marker.items.length; i++) {
            var item = marker.items[i];
            html += '<div class="popup-item">' +
                    '<div class="popup-title">' + item.title + '</div>' +
                    (item.location ? '<div class="popup-location">' + item.location + '</div>' : '') +
                    '<div class="popup-date">' + item.date + '</div>' +
                    '</div>';
        }
        popupEl.innerHTML = html;
        popupEl.style.display = 'block';
        popupEl.style.left = Math.min(x, mapEl.offsetWidth - 270) + 'px';
        popupEl.style.top = (y - 40) + 'px';
    }

    function hidePopup() {
        popupEl.style.display = 'none';
    }

    function render() {
        renderTiles();
        renderMarkers();
    }

    function zoomIn() {
        if (zoom < 18) { zoom++; render(); }
    }

    function zoomOut() {
        if (zoom > 1) { zoom--; render(); }
    }

    // Mouse events
    mapEl.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('marker')) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartLat = centerLat;
        dragStartLng = centerLng;
        hidePopup();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        var dx = e.clientX - dragStartX;
        var dy = e.clientY - dragStartY;
        var scale = 256 * Math.pow(2, zoom);
        var dlng = -dx / scale * 360;
        var dlat = dy / scale * 360 * Math.cos(centerLat * Math.PI / 180);
        centerLat = dragStartLat + dlat;
        centerLng = dragStartLng + dlng;
        render();
    });

    document.addEventListener('mouseup', function() {
        isDragging = false;
    });

    // Touch events
    mapEl.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            var touch = e.touches[0];
            if (e.target.classList.contains('marker')) return;
            isDragging = true;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            dragStartLat = centerLat;
            dragStartLng = centerLng;
            hidePopup();
        }
    }, { passive: true });

    mapEl.addEventListener('touchmove', function(e) {
        if (!isDragging || e.touches.length !== 1) return;
        var touch = e.touches[0];
        var dx = touch.clientX - dragStartX;
        var dy = touch.clientY - dragStartY;
        var scale = 256 * Math.pow(2, zoom);
        var dlng = -dx / scale * 360;
        var dlat = dy / scale * 360 * Math.cos(centerLat * Math.PI / 180);
        centerLat = dragStartLat + dlat;
        centerLng = dragStartLng + dlng;
        render();
    }, { passive: true });

    mapEl.addEventListener('touchend', function() {
        isDragging = false;
    }, { passive: true });

    // Click to hide popup
    mapEl.addEventListener('click', function(e) {
        if (!e.target.classList.contains('marker')) {
            hidePopup();
        }
    });

    // Zoom buttons
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);

    // Double click zoom
    mapEl.addEventListener('dblclick', function(e) {
        e.preventDefault();
        if (zoom < 18) {
            zoom++;
            var rect = mapEl.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var center = latLngToPixel(centerLat, centerLng, zoom - 1);
            var scale = 256 * Math.pow(2, zoom);
            var lng = (center.x - mapEl.offsetWidth / 2 + x) / scale * 360 - 180;
            var n = Math.PI - 2 * Math.PI * (center.y - mapEl.offsetHeight / 2 + y) / scale;
            var lat = Math.atan(Math.sinh(n)) * 180 / Math.PI;
            centerLat = lat;
            centerLng = lng;
            render();
        }
    });

    // Set markers from outside
    window.setMarkers = function(data) {
        var groups = {};
        for (var i = 0; i < data.length; i++) {
            var m = data[i];
            var key = m.lat.toFixed(2) + ',' + m.lng.toFixed(2);
            if (!groups[key]) groups[key] = [];
            groups[key].push(m);
        }

        allMarkers = [];
        var bounds = [];

        var keys = Object.keys(groups);
        for (var k = 0; k < keys.length; k++) {
            var group = groups[keys[k]];
            var first = group[0];
            bounds.push([first.lat, first.lng]);
            allMarkers.push({
                id: first.id,
                lat: first.lat,
                lng: first.lng,
                count: group.length,
                items: group
            });
        }

        if (bounds.length > 0) {
            var minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
            for (var i = 0; i < bounds.length; i++) {
                if (bounds[i][0] < minLat) minLat = bounds[i][0];
                if (bounds[i][0] > maxLat) maxLat = bounds[i][0];
                if (bounds[i][1] < minLng) minLng = bounds[i][1];
                if (bounds[i][1] > maxLng) maxLng = bounds[i][1];
            }
            centerLat = (minLat + maxLat) / 2;
            centerLng = (minLng + maxLng) / 2;

            var latDiff = maxLat - minLat;
            var lngDiff = maxLng - minLng;
            if (latDiff > 0 || lngDiff > 0) {
                for (var z = 18; z >= 1; z--) {
                    var scale = 256 * Math.pow(2, z);
                    var pixelDiff = Math.max(latDiff, lngDiff) / 360 * scale;
                    if (pixelDiff < mapEl.offsetWidth * 0.8) {
                        zoom = z;
                        break;
                    }
                }
            }
        }

        render();
    };

    // Initial render with delay to ensure layout
    function initRender() {
        if (mapEl.offsetWidth > 0 && mapEl.offsetHeight > 0) {
            render();
        } else {
            setTimeout(initRender, 100);
        }
    }

    if (document.readyState === 'complete') {
        initRender();
    } else {
        window.addEventListener('load', initRender);
    }

    window.addEventListener('resize', render);
})();
</script>
</body>
</html>
