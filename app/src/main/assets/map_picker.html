<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { width: 100%; height: calc(100vh - 56px); }
        #search-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); height: 56px;
        }
        #search-input {
            flex: 1; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 8px 12px; font-size: 14px; outline: none;
        }
        #search-input:focus { border-color: #4A90D9; }
        #search-btn {
            background: #4A90D9; color: #fff; border: none;
            border-radius: 8px; padding: 8px 16px; font-size: 14px;
            cursor: pointer; white-space: nowrap;
        }
        #search-btn:active { opacity: 0.8; }
        #confirm-btn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #4A90D9; color: #fff; border: none;
            border-radius: 12px; padding: 12px 32px; font-size: 15px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(74,144,217,0.3);
            display: none; z-index: 1000;
        }
        #confirm-btn:active { opacity: 0.8; }
        #picked-info {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff; border-radius: 8px;
            padding: 8px 16px; font-size: 13px; z-index: 1000;
            display: none; max-width: 80%; text-align: center;
        }
        .search-results {
            position: absolute; top: 56px; left: 0; right: 0;
            background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 200px; overflow-y: auto; z-index: 1000; display: none;
        }
        .search-result-item {
            padding: 10px 12px; border-bottom: 1px solid #f0f0f0;
            font-size: 13px; cursor: pointer;
        }
        .search-result-item:active { background: #f5f5f5; }
    </style>
</head>
<body>
    <div id="search-bar">
        <input id="search-input" type="text" placeholder="搜索地点..." />
        <button id="search-btn" onclick="searchLocation()">搜索</button>
    </div>
    <div class="search-results" id="search-results"></div>
    <div id="map"></div>
    <div id="picked-info"></div>
    <button id="confirm-btn" onclick="confirmSelection()">确认选择</button>

    <script>
        var map = L.map('map').setView([31.23, 121.47], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        var marker = null;
        var pickedLat = null;
        var pickedLng = null;
        var pickedName = '';

        function onMapClick(e) {
            pickedLat = e.latlng.lat;
            pickedLng = e.latlng.lng;
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng, {draggable: true}).addTo(map);
                marker.on('dragend', function() {
                    var pos = marker.getLatLng();
                    pickedLat = pos.lat;
                    pickedLng = pos.lng;
                    reverseGeocode(pickedLat, pickedLng);
                });
            }
            reverseGeocode(pickedLat, pickedLng);
        }

        map.on('click', onMapClick);

        function reverseGeocode(lat, lng) {
            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    pickedName = data.display_name ? data.display_name.split(',').slice(0, 3).join(',').trim() : lat.toFixed(4) + ', ' + lng.toFixed(4);
                    showPickedInfo(pickedName);
                })
                .catch(function() {
                    pickedName = lat.toFixed(4) + ', ' + lng.toFixed(4);
                    showPickedInfo(pickedName);
                });
        }

        function showPickedInfo(name) {
            var info = document.getElementById('picked-info');
            info.textContent = name;
            info.style.display = 'block';
            document.getElementById('confirm-btn').style.display = 'block';
        }

        function confirmSelection() {
            if (pickedLat !== null && pickedLng !== null && window.MapBridge) {
                MapBridge.onLocationPicked(pickedLat, pickedLng, pickedName);
            }
        }

        function searchLocation() {
            var query = document.getElementById('search-input').value.trim();
            if (!query) return;
            fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=5')
                .then(function(r) { return r.json(); })
                .then(function(results) {
                    var container = document.getElementById('search-results');
                    container.innerHTML = '';
                    if (results.length === 0) {
                        container.style.display = 'none';
                        return;
                    }
                    results.forEach(function(item) {
                        var div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.textContent = item.display_name.split(',').slice(0, 3).join(',').trim();
                        div.onclick = function() {
                            container.style.display = 'none';
                            var lat = parseFloat(item.lat);
                            var lng = parseFloat(item.lon);
                            map.setView([lat, lng], 16);
                            pickedLat = lat;
                            pickedLng = lng;
                            pickedName = div.textContent;
                            if (marker) {
                                marker.setLatLng([lat, lng]);
                            } else {
                                marker = L.marker([lat, lng], {draggable: true}).addTo(map);
                                marker.on('dragend', function() {
                                    var pos = marker.getLatLng();
                                    pickedLat = pos.lat;
                                    pickedLng = pos.lng;
                                    reverseGeocode(pickedLat, pickedLng);
                                });
                            }
                            showPickedInfo(pickedName);
                        };
                        container.appendChild(div);
                    });
                    container.style.display = 'block';
                })
                .catch(function() {});
        }

        // Enter key to search
        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchLocation();
        });

        // Set initial location from Kotlin
        function setInitialLocation(lat, lng) {
            if (lat && lng) {
                map.setView([lat, lng], 15);
                pickedLat = lat;
                pickedLng = lng;
                marker = L.marker([lat, lng], {draggable: true}).addTo(map);
                marker.on('dragend', function() {
                    var pos = marker.getLatLng();
                    pickedLat = pos.lat;
                    pickedLng = pos.lng;
                    reverseGeocode(pickedLat, pickedLng);
                });
                reverseGeocode(lat, lng);
            }
        }
    </script>
</body>
</html>
