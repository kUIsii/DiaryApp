<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiaryApp 统计与回顾预�?/title>
  <link rel="stylesheet" href="ui-preview-system.css">
  <style>
    .stats-hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .headline-card {
      padding: 17px;
      min-height: 148px;
    }

    .headline-card strong {
      display: block;
      margin-top: 10px;
      color: var(--text);
      font-size: 34px;
      line-height: 1;
      font-family: var(--serif);
    }

    .headline-card span,
    .small-note {
      color: var(--faint);
      font-size: 11px;
      line-height: 1.5;
    }

    .ring-card {
      display: grid;
      place-items: center;
      padding: 12px;
      min-height: 148px;
      text-align: center;
    }

    .ring {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, var(--card) 0 56%, transparent 57%),
        conic-gradient(var(--accent) 0 72%, color-mix(in srgb, var(--muted) 18%, transparent) 72% 100%);
    }

    .ring b {
      color: var(--text);
      font-size: 21px;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
    }

    .tag-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .tag-chip.hot {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .bar-chart {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: end;
      gap: 8px;
      height: 118px;
      padding: 15px 13px 10px;
    }

    .bar {
      display: grid;
      align-items: end;
      gap: 6px;
      color: var(--faint);
      font-size: 10px;
      text-align: center;
    }

    .bar i {
      display: block;
      height: var(--h);
      min-height: 16px;
      border-radius: 999px 999px 6px 6px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      opacity: 0.92;
    }

    .trend-card {
      padding: 14px 12px 12px;
    }

    .trend-line {
      width: 100%;
      height: 94px;
      color: var(--accent);
    }

    .trend-line .soft {
      color: var(--accent2);
    }

    .keyword-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      padding: 14px;
    }

    .keyword {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-soft);
      padding: 11px;
    }

    .keyword b {
      display: block;
      color: var(--text);
      font-size: 13px;
    }

    .keyword span {
      color: var(--faint);
      font-size: 10px;
    }

    .quote-card {
      padding: 15px;
      border-left: 3px solid var(--accent);
    }

    .quote-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 4px;
      padding: 14px;
    }

    .heat {
      aspect-ratio: 1;
      border-radius: 4px;
      background: color-mix(in srgb, var(--muted) 11%, transparent);
    }

    .heat.l1 { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .heat.l2 { background: color-mix(in srgb, var(--accent) 42%, transparent); }
    .heat.l3 { background: color-mix(in srgb, var(--accent) 68%, transparent); }
    .heat.l4 { background: color-mix(in srgb, var(--accent2) 78%, transparent); }

    .month-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      padding: 14px;
    }

    .month {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface-soft);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .month.active {
      background: color-mix(in srgb, var(--accent) 16%, var(--surface-soft));
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    }

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      padding: 14px;
    }

    .highlight {
      min-height: 74px;
      border-radius: 17px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      padding: 11px;
    }

    .highlight b {
      display: block;
      color: var(--text);
      font-size: 16px;
    }

    .highlight span {
      display: block;
      margin-top: 5px;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.35;
    }

    .month-toggle {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .month-toggle button {
      min-height: 28px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--faint);
      padding: 0 10px;
      font: 800 11px var(--font);
      cursor: pointer;
    }

    .month-toggle button.active {
      background: var(--card);
      color: var(--accent);
      box-shadow: var(--card-shadow);
    }

    .theme-note {
      color: var(--page-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .screen.compact .app-content {
      padding-bottom: 84px;
    }

    @media (max-width: 980px) {
      .preview-head {
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
