<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具 — 温暖纸艺 B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FBF5EE;
      --card-bg: #FFFFFF;
      --text-primary: #3D2E22;
      --text-secondary: #8A7060;
      --accent: #C4785A;
      --accent-2: #A8C4A2;
      --accent-3: #C9A8D4;
      --divider: rgba(180, 160, 145, 0.18);
      --shadow: 0 4px 20px rgba(140, 100, 80, 0.08);
      --shadow-hover: 0 6px 28px rgba(140, 100, 80, 0.14);
      --card-radius: 20px;
      --item-radius: 14px;
      --section-label-bg: rgba(196, 120, 90, 0.10);
      --section-label-text: #C4785A;
    }

    [data-theme="dark"] {
      --bg: #1C1915;
      --card-bg: #2A231D;
      --text-primary: #E8DDD6;
      --text-secondary: #9A8878;
      --accent: #D4906C;
      --accent-2: #A8C4A2;
      --accent-3: #C9A8D4;
      --divider: rgba(255, 255, 255, 0.07);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 6px 28px rgba(0, 0, 0, 0.4);
      --section-label-bg: rgba(212, 144, 108, 0.14);
      --section-label-text: #D4906C;
    }

    html, body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Sans SC', sans-serif;
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .device-frame {
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      background: var(--bg);
      padding: 0 20px 100px 20px;
      position: relative;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 52px 0 24px 0;
    }

    .page-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
      color: var(--text-secondary);
    }

    .theme-toggle:hover {
      background: var(--section-label-bg);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* ── Section Card ── */
    .section-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .section-card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .section-header:hover {
      background: rgba(140, 100, 80, 0.04);
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Icon pill */
    .section-icon-pill {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .section-icon-pill svg {
      width: 16px;
      height: 16px;
    }

    .section-1 .section-icon-pill {
      background: var(--section-label-bg);
      color: var(--section-label-text);
    }

    .section-2 .section-icon-pill {
      background: rgba(168, 196, 162, 0.15);
      color: #7BA87B;
    }

    .section-3 .section-icon-pill {
      background: rgba(201, 168, 212, 0.15);
      color: #A885B0;
    }

    .section-4 .section-icon-pill {
      background: rgba(138, 112, 96, 0.10);
      color: var(--text-secondary);
    }

    [data-theme="dark"] .section-2 .section-icon-pill {
      background: rgba(168, 196, 162, 0.12);
      color: #A8C4A2;
    }

    [data-theme="dark"] .section-3 .section-icon-pill {
      background: rgba(201, 168, 212, 0.12);
      color: #C9A8D4;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .section-chevron {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
      flex-shrink: 0;
    }

    .section-card.collapsed .section-chevron {
      transform: rotate(-90deg);
      opacity: 0.45;
    }

    /* Expand indicator line */
    .section-divider {
      height: 1px;
      background: var(--divider);
      margin: 0 18px;
    }

    /* ── Tool List ── */
    .tool-list {
      overflow: hidden;
      max-height: 600px;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.3s ease;
      opacity: 1;
      padding: 6px 10px 10px 10px;
    }

    .section-card.collapsed .tool-list {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .tool-item {
      display: flex;
      align-items: center;
      padding: 12px 8px;
      cursor: pointer;
      border-radius: var(--item-radius);
      transition: background 0.2s, transform 0.12s ease;
      gap: 12px;
    }

    .tool-item:hover {
      background: rgba(140, 100, 80, 0.05);
    }

    .tool-item:active {
      transform: scale(0.97);
    }

    .tool-item + .tool-item {
      border-top: 1px solid var(--divider);
    }

    .tool-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
      transition: background 0.2s;
    }

    .tool-icon svg {
      width: 15px;
      height: 15px;
    }

    .tool-text {
      flex: 1;
      min-width: 0;
    }

    .tool-name {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .tool-desc {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    .tool-arrow {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      opacity: 0.4;
      flex-shrink: 0;
      transform: rotate(180deg);
    }

    /* ── Bottom padding ── */
    .bottom-pad {
      height: 80px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 0;
    }
  </style>
</head>
<body>
<div class="device-frame">

  <!-- Header -->
  <header class="header">
    <h1 class="page-title">工具</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
      <!-- Sun icon (shown in dark mode → click to go light) -->
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon icon (shown in light mode → click to go dark) -->
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- ── Section 1: 创作与记录 ── -->
  <section class="section-card section-1" id="section-1">
    <div class="section-header" onclick="toggleSection(1)">
      <div class="section-header-left">
        <div class="section-icon-pill">
          <!-- Edit icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
        <span class="section-title">创作与记录</span>
      </div>
      <svg class="section-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon" style="color: #C4785A">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">数据统计</div>
          <div class="tool-desc">记录字数与频率分析</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon" style="color: #C4785A">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">媒体库</div>
          <div class="tool-desc">照片、视频与文件管理</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon" style="color: #C4785A">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">标签管理</div>
          <div class="tool-desc">整理与筛选日记标签</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- ── Section 2: 回忆与探索 ── -->
  <section class="section-card section-2 collapsed" id="section-2">
    <div class="section-header" onclick="toggleSection(2)">
      <div class="section-header-left">
        <div class="section-icon-pill">
          <!-- Search icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <span class="section-title">回忆与探索</span>
      </div>
      <svg class="section-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon" style="color: #7BA87B">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">倒数日</div>
          <div class="tool-desc">标记重要日期的倒数</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon" style="color: #7BA87B">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">时间胶囊</div>
          <div class="tool-desc">封存内容在未来开启</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon" style="color: #7BA87B">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
            <line x1="9" y1="3" x2="9" y2="18"/>
            <line x1="15" y1="6" x2="15" y2="21"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">日记地图</div>
          <div class="tool-desc">按地理位置回顾日记</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon" style="color: #7BA87B">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">随机回顾</div>
          <div class="tool-desc">偶然重读过去的日记</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- ── Section 3: AI 伙伴 ── -->
  <section class="section-card section-3 collapsed" id="section-3">
    <div class="section-header" onclick="toggleSection(3)">
      <div class="section-header-left">
        <div class="section-icon-pill">
          <!-- Memory icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <span class="section-title">AI 伙伴</span>
      </div>
      <svg class="section-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon" style="color: #A885B0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">AI 助手</div>
          <div class="tool-desc">智能问答与写作辅助</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon" style="color: #A885B0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">AI 传记</div>
          <div class="tool-desc">自动生成人生故事</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- ── Section 4: 其他 ── -->
  <section class="section-card section-4 collapsed" id="section-4">
    <div class="section-header" onclick="toggleSection(4)">
      <div class="section-header-left">
        <div class="section-icon-pill">
          <!-- Notifications icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <span class="section-title">其他</span>
      </div>
      <svg class="section-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon" style="color: var(--text-secondary)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>

<script>
  // Theme toggle
  const html = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const iconSun = document.getElementById('icon-sun');
  const iconMoon = document.getElementById('icon-moon');

  function applyTheme(isDark) {
    if (isDark) {
      html.setAttribute('data-theme', 'dark');
      iconSun.style.display = 'block';
      iconMoon.style.display = 'none';
    } else {
      html.removeAttribute('data-theme');
      iconSun.style.display = 'none';
      iconMoon.style.display = 'block';
    }
  }

  // Default: light. Check localStorage.
  const savedTheme = localStorage.getItem('tools-theme-B');
  applyTheme(savedTheme === 'dark');

  themeToggle.addEventListener('click', () => {
    const isDark = html.getAttribute('data-theme') === 'dark';
    applyTheme(!isDark);
    localStorage.setItem('tools-theme-B', !isDark ? 'dark' : 'light');
  });

  // Section collapse/expand
  function toggleSection(id) {
    const section = document.getElementById('section-' + id);
    if (section.classList.contains('collapsed')) {
      section.classList.remove('collapsed');
    } else {
      section.classList.add('collapsed');
    }
  }
</script>
</body>
</html>
