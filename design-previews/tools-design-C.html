<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具 — 编辑克制 C</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #EEF5F2;
      --card-bg: #FAFDFB;
      --text-primary: #18231F;
      --text-secondary: #6D7B74;
      --accent: #4F8F7A;
      --accent-light: rgba(79,143,122,0.12);
      --divider: rgba(41,69,58,0.08);
      --divider-strong: rgba(41,69,58,0.16);
    }

    [data-theme="dark"] {
      --bg: #0B131A;
      --card-bg: #101820;
      --text-primary: #E7EFE9;
      --text-secondary: #7A8B82;
      --accent: #6BAF9A;
      --accent-light: rgba(107,175,154,0.12);
      --divider: rgba(255,255,255,0.06);
      --divider-strong: rgba(255,255,255,0.12);
    }

    html, body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 300;
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .device-frame {
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      background: var(--bg);
      padding: 0 28px 80px 28px;
      position: relative;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 56px 0 36px 0;
    }

    .page-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-primary);
    }

    .theme-toggle {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
      color: var(--text-secondary);
    }

    .theme-toggle:hover {
      background: var(--accent-light);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* ── Section Group ── */
    .section-group {
      margin-bottom: 24px;
    }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      user-select: none;
    }

    .section-label {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .section-label-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    .section-indicator {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      opacity: 0.5;
    }

    .section-divider {
      height: 1px;
      background: var(--divider);
    }

    /* ── Tool List ── */
    .tool-list {
      /* No animation — always visible, restrained */
    }

    .tool-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      cursor: pointer;
      gap: 12px;
      border-bottom: 1px solid var(--divider);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .tool-item:last-child {
      border-bottom: none;
    }

    .tool-item:active {
      opacity: 0.7;
      transform: scale(0.99);
    }

    .tool-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
    }

    .tool-icon svg {
      width: 13px;
      height: 13px;
      stroke-width: 1.5;
    }

    .tool-text {
      flex: 1;
      min-width: 0;
    }

    .tool-name {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .tool-desc {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 300;
      opacity: 0.5;
      letter-spacing: 0.3px;
    }

    .tool-arrow {
      width: 12px;
      height: 12px;
      color: var(--text-secondary);
      opacity: 0.35;
      flex-shrink: 0;
      transform: rotate(180deg);
    }

    /* ── Bottom padding ── */
    .bottom-pad {
      height: 80px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 0;
    }
  </style>
</head>
<body>
<div class="device-frame">

  <!-- Header -->
  <header class="header">
    <h1 class="page-title">工具</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>

  </header>

  <!-- ── Section 1: 创作与记录 ── -->

    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">数据统计</div>
          <div class="tool-desc">记录字数与频率分析</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">媒体库</div>
          <div class="tool-desc">照片、视频与文件管理</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>

        </div>
        <div class="tool-text">
          <div class="tool-name">标签管理</div>
          <div class="tool-desc">整理与筛选日记标签</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>

  <!-- ── Section 2: 回忆与探索 ── -->
  <div class="section-group">

      <span class="section-label"><span class="section-label-dot"></span>回忆与探索</span>
      <svg class="section-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>

        <div class="tool-text">
          <div class="tool-name">倒数日</div>

        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>

      <div class="tool-item">
        <div class="tool-icon">

        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
            <line x1="9" y1="3" x2="9" y2="18"/>
            <line x1="15" y1="6" x2="15" y2="21"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">日记地图</div>
          <div class="tool-desc">按地理位置回顾日记</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">随机回顾</div>
          <div class="tool-desc">偶然重读过去的日记</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ── Section 3: AI 伙伴 ── -->
  <div class="section-group">
    <div class="section-header">
      <span class="section-label"><span class="section-label-dot"></span>AI 伙伴</span>
      <svg class="section-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">AI 助手</div>
          <div class="tool-desc">智能问答与写作辅助</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">AI 传记</div>
          <div class="tool-desc">自动生成人生故事</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ── Section 4: 其他 ── -->
  <div class="section-group">
    <div class="section-header">
      <span class="section-label"><span class="section-label-dot"></span>其他</span>
      <svg class="section-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <div class="section-divider"></div>
    <div class="tool-list">
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">消息通知</div>
          <div class="tool-desc">提醒与推送设置</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
      <div class="tool-item">
        <div class="tool-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="tool-text">
          <div class="tool-name">实验性功能</div>
          <div class="tool-desc">正在探索的新特性</div>
        </div>
        <svg class="tool-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="bottom-pad"></div>
</div>

<script>
  const html = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const iconSun = document.getElementById('icon-sun');
  const iconMoon = document.getElementById('icon-moon');

  function applyTheme(isDark) {
    if (isDark) {
      html.setAttribute('data-theme', 'dark');
      iconSun.style.display = 'block';
      iconMoon.style.display = 'none';
    } else {
      html.removeAttribute('data-theme');
      iconSun.style.display = 'none';
      iconMoon.style.display = 'block';
    }
  }

  const savedTheme = localStorage.getItem('tools-theme-C');
  applyTheme(savedTheme === 'dark');

  themeToggle.addEventListener('click', () => {
    const isDark = html.getAttribute('data-theme') === 'dark';
    applyTheme(!isDark);
    localStorage.setItem('tools-theme-C', !isDark ? 'dark' : 'light');
  });
</script>
</body>
</html>
