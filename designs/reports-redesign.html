<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日记报告 · 月报 / 年报 重设计</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg1:#F5F7FA; --bg2:#EFF3F8; --bg3:#E8EDF4;
    --surface:#FFFFFF; --card:#FFFFFF;
    --text:#2C3344; --text2:#5A6577; --text3:#8A96A8;
    --accent:#6B8DB5; --accent2:#B5926B; --accent3:#9B8EBA;
    --border:rgba(130,150,180,.30);
    --shadow:0 8px 24px rgba(60,80,120,.10);
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #d7e0ec 0%, #e9edf2 55%, #e3e8ef 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;color:var(--text);
  }
  .phone{
    width:100%;max-width:412px;height:872px;max-height:94vh;
    background:linear-gradient(180deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    border-radius:42px;box-shadow:0 30px 70px rgba(40,55,90,.28), inset 0 0 0 1px rgba(255,255,255,.4);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .phone::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(360px 240px at 88% 2%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
      radial-gradient(320px 260px at -6% 16%, color-mix(in srgb, var(--accent3) 11%, transparent), transparent 70%),
      radial-gradient(420px 320px at 70% 100%, color-mix(in srgb, var(--accent2) 9%, transparent), transparent 72%);
    opacity:.9;
  }
  .statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;position:relative;z-index:2;}
  .statusbar .right{display:flex;gap:7px;align-items:center;}
  .statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--text3);opacity:.6;}
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:4px 18px 8px;position:relative;z-index:2;}
  .iconbtn{width:40px;height:40px;border-radius:50%;flex:0 0 40px;background:color-mix(in srgb, var(--surface) 70%, transparent);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:transform .15s;}
  .iconbtn:active{transform:scale(.94);}
  .topbar .titlewrap{flex:1;min-width:0;}
  .topbar h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;margin:0;line-height:1.1;letter-spacing:.5px;}
  .topbar .sub{font-size:12px;color:var(--text3);margin-top:2px;}

  /* period tabs */
  .tabs{display:flex;gap:6px;margin:0 18px 6px;background:color-mix(in srgb,var(--surface) 55%, transparent);border:1px solid var(--border);border-radius:14px;padding:4px;position:relative;z-index:2;}
  .tabs .tab{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:14px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .18s;}
  .tabs .tab.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent);}
  /* period nav */
  .pnav{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 18px 8px;position:relative;z-index:2;}
  .pnav .arw{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;background:color-mix(in srgb,var(--surface) 55%, transparent);border:1px solid var(--border);}
  .pnav .lbl{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:800;color:var(--text);min-width:120px;text-align:center;}

  .scroll{flex:1;overflow-y:auto;padding:2px 18px 92px;position:relative;z-index:2;}
  .scroll::-webkit-scrollbar{width:0;}

  /* section header with hierarchy step */
  .sec{margin-top:16px;}
  .sec:first-child{margin-top:4px;}
  .sec-h{display:flex;align-items:center;gap:9px;margin:0 2px 10px;}
  .sec-h .step{width:22px;height:22px;border-radius:7px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC",serif;font-size:12px;font-weight:900;color:#fff;background:var(--accent);}
  .sec-h .tt{font-size:14px;font-weight:800;color:var(--text);letter-spacing:.5px;}
  .sec-h .desc{font-size:11px;color:var(--text3);margin-left:auto;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px;}
  .card + .card{margin-top:10px;}

  /* overview big grid (month) */
  .ov{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ov .b{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:15px 16px;position:relative;overflow:hidden;}
  .ov .b .k{font-size:12px;color:var(--text3);margin-bottom:8px;}
  .ov .b .v{font-family:"Noto Serif SC",serif;font-size:30px;font-weight:900;line-height:1;color:var(--text);}
  .ov .b .v small{font-size:14px;font-weight:700;color:var(--text2);margin-left:3px;}
  .ov .b .d{font-size:11px;margin-top:8px;display:flex;align-items:center;gap:4px;}
  .ov .b .d.up{color:var(--accent);} .ov .b .d.dn{color:var(--text3);}
  .ov .b.hl{grid-column:span 2;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--card));}
  .ov .b.hl .v{color:var(--accent);font-size:34px;}

  /* chart blocks */
  .cap{font-size:12px;color:var(--text3);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .cap b{color:var(--text2);font-weight:700;}
  .bars{display:flex;align-items:flex-end;gap:3px;height:96px;}
  .bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
  .bars .col i{width:100%;max-width:12px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent));min-height:3px;}
  .bars .col.dim i{background:color-mix(in srgb,var(--text3) 30%,transparent);}
  .bars .col.top i{background:linear-gradient(180deg,var(--accent2),color-mix(in srgb,var(--accent2) 55%,transparent));}
  .axis{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--text3);}
  .linewrap{position:relative;}
  svg.line{width:100%;height:110px;display:block;overflow:visible;}
  .line .grid{stroke:var(--border);stroke-width:1;}
  .line .area{fill:color-mix(in srgb,var(--accent) 14%, transparent);}
  .line .stroke{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .line .dot{fill:var(--accent);}

  /* mood distribution rows */
  .mrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .mrow:last-child{margin-bottom:0;}
  .mrow .name{font-size:12px;color:var(--text2);width:38px;flex:0 0 38px;}
  .mrow .track{flex:1;height:9px;border-radius:999px;background:color-mix(in srgb,var(--text3) 12%,transparent);overflow:hidden;}
  .mrow .track i{display:block;height:100%;border-radius:999px;}
  .mrow .pct{font-size:11px;color:var(--text3);width:34px;flex:0 0 34px;text-align:right;}

  /* time distribution donut */
  .donutwrap{display:flex;align-items:center;gap:16px;}
  .donutwrap .legend{flex:1;min-width:0;}
  .lgd{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;color:var(--text2);}
  .lgd:last-child{margin-bottom:0;}
  .lgd .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}
  .lgd .n{flex:1;} .lgd .v{color:var(--text3);font-size:11px;}

  /* stat mini grid */
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini .m{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid var(--border);}
  .mini .m .k{font-size:11px;color:var(--text3);margin-bottom:6px;}
  .mini .m .v{font-size:16px;font-weight:800;color:var(--text);}
  .mini .m .v small{font-size:12px;color:var(--text2);font-weight:600;}

  /* tag chips */
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tags .tg{font-size:12px;padding:6px 12px;border-radius:999px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .tags .tg .c{width:7px;height:7px;border-radius:50%;}

  /* weather list */
  .wlist .wr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .wlist .wr:last-child{border-bottom:none;}
  .wlist .wr .wn{font-size:13px;color:var(--text);width:44px;flex:0 0 44px;}
  .wlist .wr .wt{flex:1;height:7px;border-radius:999px;background:color-mix(in srgb,var(--text3) 12%,transparent);overflow:hidden;}
  .wlist .wr .wt i{display:block;height:100%;background:var(--accent);border-radius:999px;}
  .wlist .wr .wc{font-size:11px;color:var(--text3);width:60px;flex:0 0 60px;text-align:right;}

  /* highlight cards */
  .hi{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border);}
  .hi:last-child{border-bottom:none;padding-bottom:0;}
  .hi:first-child{padding-top:0;}
  .hi .ic{width:40px;height:40px;border-radius:12px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);}
  .hi .hb{flex:1;min-width:0;}
  .hi .hb .k{font-size:11px;color:var(--text3);margin-bottom:3px;}
  .hi .hb .t{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hi .hb .m{font-size:12px;color:var(--text2);margin-top:3px;}

  /* comparison */
  .cmp{display:flex;flex-direction:column;gap:12px;}
  .cmp .cr{display:flex;align-items:center;gap:12px;}
  .cmp .cr .cn{font-size:13px;color:var(--text2);width:52px;flex:0 0 52px;}
  .cmp .cr .cbars{flex:1;display:flex;flex-direction:column;gap:5px;}
  .cmp .cr .cb{height:16px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:#fff;min-width:34px;}
  .cmp .cr .cb.now{background:var(--accent);}
  .cmp .cr .cb.prev{background:color-mix(in srgb,var(--text3) 45%,transparent);}
  .cmp .cr .cd{font-size:12px;font-weight:800;width:46px;flex:0 0 46px;text-align:right;}
  .cmp .cr .cd.up{color:var(--accent);} .cmp .cr .cd.dn{color:var(--text3);}

  /* narrative closing */
  .story{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card));border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);}
  .story .q{font-family:"Noto Serif SC",serif;font-size:15px;line-height:1.9;color:var(--text);}
  .story .q b{color:var(--accent);}
  .story .sign{font-size:12px;color:var(--text3);margin-top:12px;text-align:right;}

  /* ===== 年报（xiaomo 克制风 · 无环形 / 无叙事） ===== */
  .yearHero{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 16%,var(--card)),color-mix(in srgb,var(--accent3) 8%,var(--card)));border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:20px;position:relative;overflow:hidden;}
  .yearHero .yr{font-family:"Noto Serif SC",serif;font-size:46px;font-weight:900;line-height:.9;color:var(--text);letter-spacing:1px;}
  .yearHero .yr small{font-size:13px;font-weight:700;color:var(--text3);margin-left:8px;letter-spacing:2px;}
  .yearHero .tagline{font-size:13px;color:var(--text2);margin-top:10px;line-height:1.7;}
  .yearHero .yrstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
  .yearHero .yrstats .s .n{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:900;color:var(--text);line-height:1;}
  .yearHero .yrstats .s .n small{font-size:11px;color:var(--text3);font-weight:700;}
  .yearHero .yrstats .s .l{font-size:10px;color:var(--text3);margin-top:4px;}

  /* 月度柱状 */
  .yrbars{display:flex;align-items:flex-end;gap:5px;height:148px;}
  .yrbars .col{flex:1;height:100%;display:flex;align-items:flex-end;}
  .yrbars .col i{width:100%;border-radius:7px 7px 5px 5px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,transparent),color-mix(in srgb,var(--accent3) 50%,transparent));}
  .yrbars .col.top i{background:linear-gradient(180deg,var(--accent),var(--accent3));}
  .yrbars .axis{display:flex;gap:5px;margin-top:7px;}
  .yrbars .axis span{flex:1;text-align:center;font-size:9px;color:var(--text3);}

  /* 高光信号列表 */
  .signal{display:grid;gap:10px;}
  .signal .s{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:16px;background:var(--card);}
  .signal .s .dot{width:11px;height:11px;border-radius:50%;margin-top:4px;}
  .signal .s .k{font-size:11px;color:var(--text3);font-weight:600;}
  .signal .s .t{font-size:14px;font-weight:700;color:var(--text);margin-top:2px;line-height:1.35;}
  .signal .s .m{font-size:11px;color:var(--text2);margin-top:3px;}

  /* 时段横向条 */
  .timebars{display:grid;gap:9px;}
  .timebars .tb{display:grid;grid-template-columns:48px 1fr 52px;gap:10px;align-items:center;font-size:11px;color:var(--text2);}
  .timebars .tb .track{height:9px;border-radius:999px;background:color-mix(in srgb,var(--text3) 12%,transparent);overflow:hidden;}
  .timebars .tb .track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent3));}
  .timebars .tb .v{text-align:right;font-weight:700;color:var(--text);}

  /* theme switcher */
  .themes{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:9px;padding:12px 16px 16px;background:linear-gradient(180deg,transparent, color-mix(in srgb,var(--bg3) 85%, transparent) 55%, var(--bg3));}
  .themes .sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex:0 0 22px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .themes .sw.on{border-color:var(--text);}
  .themes .dark{margin-left:auto;font-size:12px;color:var(--text2);cursor:pointer;background:color-mix(in srgb,var(--surface) 60%, transparent);border:1px solid var(--border);padding:6px 11px;border-radius:999px;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="right"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>

  <div class="topbar">
    <div class="iconbtn" title="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="titlewrap">
      <h1 id="ptitle">月度报告</h1>
      <div class="sub" id="psub">2026 年 7 月 · 记录你的每一天</div>
    </div>
    <div class="iconbtn" title="分享">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-p="month">月度</div>
    <div class="tab" data-p="year">年度</div>
  </div>

  <div class="pnav">
    <div class="arw" title="上一期"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="lbl" id="pnavlbl">2026 年 7 月</div>
    <div class="arw" title="下一期"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="themes" id="themes"></div>
</div>

<script>
/* ===== 真实主题色（取自 Color.kt） ===== */
const THEMES = {
  fog:{name:'雾蓝灰', light:{bg1:'#F5F7FA',bg2:'#EFF3F8',bg3:'#E8EDF4',surface:'#FFFFFF',card:'#FFFFFF',text:'#2C3344',text2:'#5A6577',text3:'#8A96A8',accent:'#6B8DB5',accent2:'#B5926B',accent3:'#9B8EBA',border:'rgba(130,150,180,.30)'},
        dark:{bg1:'#0B0D12',bg2:'#0E1018',bg3:'#11131C',surface:'#161822',card:'#181A26',text:'#D8E0F0',text2:'#9AA8C0',text3:'#6A7890',accent:'#88B0D4',accent2:'#D4A878',accent3:'#A89AC8',border:'rgba(130,150,180,.18)'}},
  moss:{name:'苔藓绿', light:{bg1:'#F6F7F4',bg2:'#EFF2EB',bg3:'#E5EAE0',surface:'#FCFDFB',card:'#FCFDFB',text:'#2E3328',text2:'#5A6450',text3:'#8A9480',accent:'#7BA06E',accent2:'#C4A06B',accent3:'#A088B0',border:'rgba(100,122,90,.30)'},
        dark:{bg1:'#0B0D0A',bg2:'#0E110D',bg3:'#111410',surface:'#161A14',card:'#181C16',text:'#D8E4D0',text2:'#9AAA90',text3:'#6A7A60',accent:'#8BC07A',accent2:'#D4B078',accent3:'#B098C4',border:'rgba(100,122,90,.16)'}},
  ocean:{name:'海潮蓝', light:{bg1:'#F2FBFC',bg2:'#E8F6FA',bg3:'#E2F0F6',surface:'#FFFFFF',card:'#FFFFFF',text:'#173D46',text2:'#4F6E79',text3:'#7A93A0',accent:'#5A9EA0',accent2:'#6B93C4',accent3:'#7D94B8',border:'rgba(123,184,199,.30)'},
        dark:{bg1:'#091318',bg2:'#0C1820',bg3:'#101E29',surface:'#121B24',card:'#15212B',text:'#D9EEF0',text2:'#9AB7C0',text3:'#6E8790',accent:'#7BBCBE',accent2:'#7DA0D4',accent3:'#8FA0C7',border:'rgba(123,184,199,.17)'}},
  petal:{name:'陶粉玫瑰', light:{bg1:'#FFF8F7',bg2:'#FFEFED',bg3:'#F8E6E3',surface:'#FFFFFF',card:'#FFFFFF',text:'#422A2A',text2:'#72585A',text3:'#9A8587',accent:'#C48880',accent2:'#B08AA8',accent3:'#D4A090',border:'rgba(211,138,128,.30)'},
        dark:{bg1:'#181013',bg2:'#1E1216',bg3:'#27181B',surface:'#221619',card:'#281A1D',text:'#F2DCDC',text2:'#C3A7A7',text3:'#9C8587',accent:'#D4A098',accent2:'#C49BC4',accent3:'#D8B098',border:'rgba(224,141,132,.17)'}},
  sand:{name:'沙金琥珀', light:{bg1:'#FCFAF3',bg2:'#F7F1E6',bg3:'#F0E5D3',surface:'#FFFFFF',card:'#FFFFFF',text:'#42361D',text2:'#6C5C40',text3:'#9A8C73',accent:'#B89860',accent2:'#BF8878',accent3:'#A09070',border:'rgba(201,163,94,.30)'},
        dark:{bg1:'#17140F',bg2:'#1D1812',bg3:'#251F17',surface:'#231D16',card:'#2A221A',text:'#F0E5D4',text2:'#C0AD8A',text3:'#9C8C73',accent:'#CCAD70',accent2:'#CCA088',accent3:'#B8A080',border:'rgba(207,165,91,.17)'}},

/* ===== helpers ===== */
function C(k){const t=dark?THEMES[cur].dark:THEMES[cur].light;return {accent:t.accent,accent2:t.accent2,accent3:t.accent3}[k]||t.accent;}
function hexA(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}
function delta(now,prev,unit=''){const d=now-prev;const up=d>=0;const pct=prev?Math.round(Math.abs(d)/prev*100):0;return `<div class="d ${up?'up':'dn'}">${up?'▲':'▼'} ${up?'+':'−'}${Math.abs(d)}${unit} 较${DATA[period].prevLabel} ${pct}%</div>`;}

function secH(step,title,desc){return `<div class="sec-h"><div class="step">${step}</div><div class="tt">${title}</div><div class="desc">${desc||''}</div></div>`;}

/* bar chart (daily) */
function barChart(vals,labels,topIdx){
  const max=Math.max(...vals,1);
  let cols=vals.map((v,i)=>{
    const h=Math.round(v/max*100);
    const cls=v===0?'dim':(i===topIdx?'top':'');
    return `<div class="col ${cls}"><i style="height:${v===0?3:h}%"></i></div>`;
  }).join('');
  let ax=labels?`<div class="axis">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`:'';
  return `<div class="bars">${cols}</div>${ax}`;
}
/* line chart */
function lineChart(vals){
  const w=340,h=100,pad=6;const mx=6,mn=1;
  const step=(w-pad*2)/(vals.length-1);
  const pts=vals.map((v,i)=>{const x=pad+i*step;const y=h-pad-((v-mn)/(mx-mn))*(h-pad*2);return [x,y];});
  const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const area=d+` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const dots=pts.map(p=>`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4"/>`).join('');
  const grid=[0,.5,1].map(f=>{const y=pad+f*(h-pad*2);return `<line class="grid" x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}"/>`;}).join('');
  return `<svg class="line" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<path class="area" d="${area}"/><path class="stroke" d="${d}"/>${dots}</svg>`;
}
/* mood distribution */
function moodDist(dist){
  const total=dist.reduce((a,b)=>a+b,0)||1;
  return dist.map((c,i)=>{
    const lvl=i+1;const pct=Math.round(c/total*100);
    return `<div class="mrow"><div class="name" style="color:${MOODCOLORS[lvl]}">${MOODNAMES[lvl]}</div>
      <div class="track"><i style="width:${pct}%;background:${MOODCOLORS[lvl]}"></i></div>
      <div class="pct">${pct}%</div></div>`;
  }).join('');
}
/* time donut */
function timeDonut(time){
  const labels=['上午','中午','下午','傍晚','深夜','凌晨'];
  const cols=[C('accent'),C('accent2'),C('accent3'),hexA(C('accent'),.6),hexA(C('accent3'),.6),hexA(C('accent2'),.6)];
  const total=time.reduce((a,b)=>a+b,0)||1;
  let off=0;const r=42,cir=2*Math.PI*r;
  const segs=time.map((v,i)=>{const frac=v/total;const len=frac*cir;const s=`<circle cx="54" cy="54" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="16" stroke-dasharray="${len} ${cir-len}" stroke-dashoffset="${-off}" transform="rotate(-90 54 54)"/>`;off+=len;return s;}).join('');
  const topIdx=time.indexOf(Math.max(...time));
  const legend=time.map((v,i)=>`<div class="lgd"><span class="sw" style="background:${cols[i]}"></span><span class="n">${labels[i]}</span><span class="v">${v} 篇 · ${Math.round(v/total*100)}%</span></div>`).join('');
  return `<div class="donutwrap"><svg width="108" height="108" viewBox="0 0 108 108">${segs}
    <text x="54" y="50" text-anchor="middle" font-size="12" fill="${C('accent')}" font-weight="700">最活跃</text>
    <text x="54" y="68" text-anchor="middle" font-size="15" fill="var(--text)" font-weight="800">${labels[topIdx]}</text></svg>
    <div class="legend">${legend}</div></div>`;
}

  r.setProperty('--bg1',t.bg1);r.setProperty('--bg2',t.bg2);r.setProperty('--bg3',t.bg3);
  r.setProperty('--surface',t.surface);r.setProperty('--card',t.card);
  r.setProperty('--text',t.text);r.setProperty('--text2',t.text2);r.setProperty('--text3',t.text3);
  r.setProperty('--accent',t.accent);r.setProperty('--accent2',t.accent2);r.setProperty('--accent3',t.accent3);
  r.setProperty('--border',t.border);
  document.body.style.color=t.text;
  render();renderThemes();
}
function renderThemes(){
  const box=document.getElementById('themes');let h='';
  ORDER.forEach(k=>{h+=`<div class="sw ${k===cur?'on':''}" data-k="${k}" style="background:${THEMES[k].light.accent}"></div>`;});
  h+=`<div class="dark" id="darkToggle">${dark?'浅色':'深色'}模式</div>`;
  box.innerHTML=h;
  box.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{cur=el.dataset.k;applyTheme();});
  document.getElementById('darkToggle').onclick=()=>{dark=!dark;applyTheme();};
}
function render(){
  const d=DATA[period];
  document.getElementById('ptitle').textContent={month:'月度报告',year:'年度报告'}[period];
  document.getElementById('psub').textContent=d.sub;
  document.getElementById('pnavlbl').textContent=d.label;
  document.getElementById('scroll').innerHTML=period==='month'?renderMonth():renderYear();
  document.getElementById('scroll').scrollTop=0;
}
document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>{
  period=t.dataset.p;document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on',x===t));render();
});
applyTheme();
</script>
</body>
</html>
